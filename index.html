<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}</style><title>God Bless</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Russo+One&display=swap">
</head><body><style id="app-style">
/* Layout: one centred column. Logo on top, three pill links, copyright line at the bottom. Admin is a two-card page on the same dark ground. */
:root{color-scheme:dark;--bg:#0b0506;--fg:#f4f1ee;--muted:#cdbcbc;--dim:#9a8888;--red:#e5201f;--red-hi:#f0302e;--red-lo:#b31314;--line:rgba(255,255,255,.13);--display:'Russo One','Arial Black',sans-serif;--text:'Inter',system-ui,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--text)}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
#root{min-height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.glow{position:absolute;left:0;right:0;top:0;height:460px;background:radial-gradient(50% 58% at 50% 22%,rgba(176,16,18,.46),rgba(176,16,18,0) 74%);pointer-events:none}
.col{position:relative;width:100%;max-width:392px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:clamp(4px,3vh,32px);display:flex;flex-direction:column}
.logo{display:block;width:100%;max-width:340px;margin:0 auto 14px;aspect-ratio:920/700;object-fit:cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 86%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 86%,transparent);mask-composite:intersect}
.links{display:flex;flex-direction:column;gap:12px}
.foot{position:relative;margin:auto 0 0;padding:28px 16px 22px;font-size:11px;letter-spacing:.06em;color:var(--dim);text-align:center}
.lnk{display:flex;align-items:center;gap:14px;height:62px;padding:0 9px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px var(--line),0 10px 28px rgba(0,0,0,.4);color:var(--fg);transition:background .2s ease,box-shadow .2s ease,transform .2s ease}
.lnk .ic,.row .ic,.pv .ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,var(--red-hi),#bd1415);color:#fff;box-shadow:0 0 18px rgba(229,32,31,.5);transition:background .2s ease,box-shadow .2s ease}
.lnk .tx,.pv .tx{flex:1;min-width:0;font-family:var(--display);font-size:14px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk .ar,.pv .ar{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);color:#d6c6c6;transition:background .2s ease,color .2s ease,box-shadow .2s ease}
a.lnk:hover{background:linear-gradient(180deg,#e32523,var(--red-lo));box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 12px 32px rgba(222,31,30,.4);color:#fff}
a.lnk:hover .ic{background:rgba(0,0,0,.28);box-shadow:none}
a.lnk:hover .ar{background:#fff;color:#c01516;box-shadow:none}
a.lnk:active{transform:scale(.985)}
.lnk.dis{opacity:.55;cursor:default}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
/* admin */
.adm{position:relative;width:100%;max-width:1000px;padding:24px max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.brand b{font-weight:400;color:#ef3a38}
.ghost{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border:0;border-radius:999px;background:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);color:var(--fg);font:600 14px var(--text);cursor:pointer}
.ghost:hover{background:rgba(255,255,255,.06)}
.h1{margin:34px 0 6px 4px;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1}
.sub{margin:0 0 20px 4px;color:#bfaeae;max-width:60ch}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;padding:14px 14px 14px 22px;border-radius:28px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.bar .st{flex:1 1 220px;min-width:0;font-size:13px;color:var(--muted)}
.bar .st.ok{color:#9be3a8}.bar .st.err{color:#ff9b99}.bar .st.warn{color:#ffd28a}
.cols{display:flex;flex-wrap:wrap;align-items:flex-start;gap:20px}
.card{min-width:0;padding:24px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 14px 36px rgba(0,0,0,.4)}
.card.l{flex:1.4 1 460px}.card.r{flex:1 1 320px;display:flex;flex-direction:column;gap:18px}
.h2{margin:0;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.1em;text-transform:uppercase}
.lbl{display:block;margin:0 0 8px 8px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#bfaeae}
.field{width:100%;height:48px;padding:0 20px;background:rgba(0,0,0,.35);color:var(--fg);border:0;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font:500 15px var(--text)}
.field.sm{height:40px;padding:0 16px;font-size:13px;font-weight:400;color:var(--muted)}
.field.ttl{height:38px;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.field:focus{outline:2px solid var(--red);outline-offset:1px;color:#fff}
.field::placeholder{color:#8f7d7d}
.field.bad{box-shadow:inset 0 0 0 1px #ff6b69}
.list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.row{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:28px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.row .head{display:flex;align-items:flex-end;gap:12px}
.row .fld{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row .cap{margin-left:16px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#a69494}
.row .field.ttl{height:46px;font-size:14px}
.row .field.sm{height:46px;font-size:14px}
.row .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:2px}
@media (max-width:520px){.card{padding:18px}.bar{padding:14px}.bar .main{width:100%}}
.row .grp{display:flex;align-items:center;gap:2px}
.row .sl{margin-left:2px;font-size:13px;color:var(--muted)}
.row.off .head,.row.off .field.sm{opacity:.5}
.sw{flex:none;width:56px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;border-radius:999px}
.sw i{position:relative;display:block;width:44px;height:26px;border-radius:999px;background:#33201f;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:background .18s ease}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#a08f8f;transition:transform .18s ease,background .18s ease}
.sw[aria-checked="true"] i{background:#c41617;box-shadow:none}
.sw[aria-checked="true"] i::after{background:#fff;transform:translateX(18px)}
.ib{flex:none;width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:50%;padding:0;color:#9a8888;cursor:pointer;transition:background .15s ease,color .15s ease}
.ib:hover{background:rgba(255,255,255,.08);color:#fff}
.ib.del:hover{background:rgba(229,32,31,.16);color:#ff6b69}
.ib[disabled]{opacity:.3;cursor:default;pointer-events:none}
.pick{display:flex;gap:8px}
.pk{flex:1;min-width:0;height:52px;display:grid;place-items:center;background:rgba(0,0,0,.35);border:0;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--muted);padding:0;cursor:pointer}
.pk:hover{color:#fff}
.pk[aria-pressed="true"]{background:linear-gradient(180deg,var(--red-hi),#bd1415);box-shadow:0 0 16px rgba(229,32,31,.45);color:#fff}
.pv{display:flex;align-items:center;gap:14px;height:62px;padding:0 9px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px var(--line)}
.main{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 26px;border:0;border-radius:999px;background:linear-gradient(180deg,#e32523,var(--red-lo));box-shadow:0 12px 30px rgba(222,31,30,.38);color:#fff;font:400 14px var(--display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:filter .15s ease,transform .15s ease}
.main:hover{filter:brightness(1.1)}.main:active{transform:scale(.985)}
.main[disabled]{filter:grayscale(.8) brightness(.7);cursor:default;pointer-events:none}
.main.wide{width:100%}
.note{margin:14px 0 0 8px;font-size:12px;color:#a69494}
.msg{margin:0 0 0 8px;font-size:13px;color:#ff9b99}
.gate{position:relative;width:100%;max-width:360px;padding:0 max(20px,env(safe-area-inset-left,0px));margin:auto 0;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.gate .field{text-align:center;letter-spacing:.4em;font-size:18px}
.gate h1{margin:0;text-align:center;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.gate p{margin:0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.lnk,.lnk .ic,.lnk .ar,.sw i,.sw i::after,.ib,.main{transition:none}}
</style>

        ui.fails += 1;
        if (ui.fails >= 5) { ui.lockUntil = now + 30000; ui.fails = 0; ui.gateErr = 'Слишком много попыток. Подождите 30 с.'; }
        else ui.gateErr = 'Неверный пароль.';
        renderAdmin();
      }
    } }, [
      h('label', { class: 'lbl', for: 'pw', text: 'Пароль' }),
      input,
      h('div', { style: 'height:16px' }),
      h('button', { class: 'main wide', type: 'submit', text: 'Войти' })
    ]);
    root.replaceChildren(
      h('div', { class: 'glow', 'aria-hidden': 'true' }),
      h('div', { class: 'gate' }, [
        h('h1', { text: 'Админ-панель' }),
        h('p', { text: 'Введите пароль, чтобы управлять кнопками.' }),
        form,
        err
      ]),
      h('p', { class: 'foot', text: '© 2026 God Bless. Все права защищены.' })
    );
    setTimeout(function () { input.focus(); }, 0);
  }

  var barBtn, barSt;
  function updateBar() {
    if (!barBtn) return;
    var d = dirty();
    barBtn.disabled = !d || ui.saving;
    if (ui.status) { barSt.textContent = ui.status; barSt.className = 'st ' + ui.statusKind; }
    else if (d) { barSt.textContent = 'Есть изменения. Нажмите «Скачать сайт» и загрузите файл на GitHub.'; barSt.className = 'st warn'; }
    else { barSt.textContent = 'Все изменения сохранены в файле.'; barSt.className = 'st'; }
  }
  function setStatus(text, kind) { ui.status = text; ui.statusKind = kind || ''; updateBar(); }
  function touch() { ui.status = ''; ui.statusKind = ''; updateBar(); }

  function move(i, d) {
    var j = i + d;
    if (j < 0 || j >= draft.links.length) return;
    var t = draft.links[i]; draft.links[i] = draft.links[j]; draft.links[j] = t;
    touch(); renderList();
  }

  var listEl;
  function renderList() {
    listEl.replaceChildren();
    if (!draft.links.length) {
      listEl.appendChild(h('div', { class: 'note', text: 'Кнопок пока нет. Добавьте первую справа.' }));
      return;
    }
    draft.links.forEach(function (l, i) {
      var ttl = h('input', { class: 'field ttl', type: 'text', value: l.title, placeholder: 'Название кнопки', 'aria-label': 'Название кнопки', maxlength: '40', oninput: function () { l.title = ttl.value; touch(); } });
      var url = h('input', { class: 'field sm', type: 'text', value: l.url, placeholder: 'Ссылка, например https://t.me/…', 'aria-label': 'Ссылка кнопки ' + l.title, oninput: function () { l.url = url.value; url.classList.remove('bad'); touch(); } });
      var sw = h('button', { class: 'sw', type: 'button', role: 'switch', 'aria-checked': l.visible ? 'true' : 'false', 'aria-label': 'Показывать на сайте: ' + l.title, onclick: function () { l.visible = !l.visible; touch(); renderList(); } }, [h('i')]);
      listEl.appendChild(h('div', { class: 'row' + (l.visible ? '' : ' off') }, [
        h('div', { class: 'head' }, [icon(l.icon), h('div', { class: 'fld' }, [h('span', { class: 'cap', text: 'Название кнопки' }), ttl])]),
        h('div', { class: 'fld' }, [h('span', { class: 'cap', text: 'Ссылка' }), url]),
        h('div', { class: 'ctl' }, [
          h('div', { class: 'grp' }, [sw, h('span', { class: 'sl', text: l.visible ? 'Показывается' : 'Скрыта' })]),
          h('div', { class: 'grp' }, [
            h('button', { class: 'ib', type: 'button', 'aria-label': 'Выше', html: UP, disabled: i === 0, onclick: function () { move(i, -1); } }),
            h('button', { class: 'ib', type: 'button', 'aria-label': 'Ниже', html: DOWN, disabled: i === draft.links.length - 1, onclick: function () { move(i, 1); } }),
            h('button', { class: 'ib del', type: 'button', 'aria-label': 'Удалить кнопку ' + l.title, html: TRASH, onclick: function () { draft.links.splice(i, 1); touch(); renderList(); } })
          ])
        ])
      ]));
    });
  }

  function validateAll() {
    var bad = 0, empty = 0;
    draft.links.forEach(function (l) {
      var n = normUrl(l.url);
      if (n === null) bad += 1; else { l.url = n; if (!n) empty += 1; }
      l.title = (l.title || '').trim() || 'Кнопка';
    });
    return { bad: bad, empty: empty };
  }

  function save() {
    var v = validateAll();
    if (v.bad) {
      setStatus('Ссылок с ошибкой: ' + v.bad + '. Ссылка должна начинаться с https:// или t.me/.', 'err');
      renderList();
      Array.prototype.forEach.call(listEl.querySelectorAll('.row'), function (row, i) { if (normUrl(draft.links[i].url) === null) row.querySelector('.field.sm').classList.add('bad'); });
      return;
    }
    ui.saving = true; setStatus('Готовлю файл…', '');
    var next = JSON.parse(JSON.stringify(draft));
    next.updatedAt = new Date().toISOString();
    Promise.resolve().then(function () {
      var blob = new Blob([buildDoc(next)], { type: 'text/html' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }).then(function () {
      state = next; draft = JSON.parse(JSON.stringify(next)); ui.saving = false;
      setStatus('Файл index.html скачан. Загрузите его в репозиторий GitHub вместо старого, и сайт обновится.', 'ok');
      renderList();
    }).catch(function (e) {
      ui.saving = false;
      var code = e && e.code;
      var text = 'Не удалось подготовить файл. Попробуйте ещё раз.';
      if (code === 'not_granted' || code === 'not_writer' || code === 'unavailable') text = 'Не удалось скачать файл.';
      else if (code === 'conflict') text = 'Страницу уже обновили. Откройте её заново и повторите правку.';
      setStatus(text, 'err');
    });
  }

  function renderAdmin() {
    if (!ui.unlocked) { renderGate(); return; }
    barBtn = h('button', { class: 'main', type: 'button', text: 'Скачать сайт', onclick: save });
    barSt = h('div', { class: 'st', role: 'status' });
    listEl = h('div', { class: 'list' });

    var fTitle = h('input', { class: 'field', id: 'f-title', type: 'text', placeholder: 'Например, Оператор', maxlength: '40' });
    var fUrl = h('input', { class: 'field', id: 'f-url', type: 'text', placeholder: 'https://t.me/…' });
    var formErr = h('div', { class: 'msg', role: 'alert', text: ui.formErr });
    var pickWrap = h('div', { class: 'pick', role: 'group', 'aria-labelledby': 'l-icon' });
    var pv = h('div', { class: 'pv' });

    function drawPick() {
      pickWrap.replaceChildren();
      [['bot', 'Бот'], ['exchange', 'Обмен'], ['operator', 'Оператор'], ['link', 'Ссылка']].forEach(function (p) {
        pickWrap.appendChild(h('button', { class: 'pk', type: 'button', 'aria-label': p[1], 'aria-pressed': ui.newIcon === p[0] ? 'true' : 'false', html: ICONS[p[0]], onclick: function () { ui.newIcon = p[0]; drawPick(); drawPv(); } }));
      });
    }
    function drawPv() {
      pv.replaceChildren(icon(ui.newIcon), h('span', { class: 'tx', text: fTitle.value.trim() || 'Название кнопки' }), h('span', { class: 'ar', html: ARROW }));
    }
    fTitle.addEventListener('input', function () { formErr.textContent = ''; drawPv(); });
    fUrl.addEventListener('input', function () { formErr.textContent = ''; });

    var form = h('form', { class: 'card r', onsubmit: function (ev) {
      ev.preventDefault();
      var t = fTitle.value.trim(), u = normUrl(fUrl.value);
      if (!t || !fUrl.value.trim()) { formErr.textContent = 'Укажите название и ссылку.'; return; }
      if (u === null) { formErr.textContent = 'Ссылка должна начинаться с https:// или t.me/.'; return; }
      draft.links.push({ id: newId(), title: t, url: u, icon: ui.newIcon, visible: true });
      fTitle.value = ''; fUrl.value = ''; formErr.textContent = '';
      drawPv(); touch(); renderList();
    } }, [
      h('h2', { class: 'h2', text: 'Новая кнопка' }),
      h('div', {}, [h('label', { class: 'lbl', for: 'f-title', text: 'Название' }), fTitle]),
      h('div', {}, [h('label', { class: 'lbl', for: 'f-url', text: 'Ссылка' }), fUrl]),
      h('div', {}, [h('span', { class: 'lbl', id: 'l-icon', text: 'Значок' }), pickWrap]),
      h('div', {}, [h('span', { class: 'lbl', text: 'Так она выглядит на сайте' }), pv]),
      formErr,
      h('button', { class: 'main wide', type: 'submit', html: PLUS + '<span>Добавить кнопку</span>' })
    ]);

    var leftCard = h('section', { class: 'card l' }, [
      h('h2', { class: 'h2', text: 'На сайте' }),
      listEl,
      h('p', { class: 'note', text: 'Выключатель скрывает кнопку, не удаляя её. Чтобы правки попали на сайт, скачайте файл и замените index.html в репозитории GitHub.' })
    ]);

    root.replaceChildren(
      h('div', { class: 'glow', 'aria-hidden': 'true' }),
      h('div', { class: 'adm' }, [
        h('div', { class: 'top' }, [
          h('div', { class: 'brand' }, [h('span', { text: 'God' }), h('b', { text: 'Bless' })]),
          h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, [
            h('a', { class: 'ghost', href: '#', text: 'Открыть сайт' }),
            h('button', { class: 'ghost', type: 'button', text: 'Выйти', onclick: function () { ui.unlocked = false; try { sessionStorage.removeItem('gb-admin'); } catch (e) {} location.hash = ''; render(); } })
          ])
        ]),
        h('h1', { class: 'h1', text: 'Кнопки сайта' }),
        h('p', { class: 'sub', text: 'Меняйте ссылки, порядок и видимость кнопок. Готовый файл index.html загружается в GitHub, после этого сайт обновляется у всех.' }),
        h('div', { class: 'bar' }, [barSt, barBtn]),
        h('div', { class: 'cols' }, [leftCard, form])
      ]),
      h('p', { class: 'foot', text: '© 2026 God Bless. Все права защищены.' })
    );
    drawPick(); drawPv(); renderList(); updateBar();
    var v0 = draft.links.filter(function (l) { return !normUrl(l.url); }).length;
    if (v0 && !ui.status && !dirty()) setStatus('Не заданы ссылки у кнопок: ' + v0 + '. Заполните их и нажмите «Скачать сайт».', 'warn');
  }

  /* ---------- self-publish ---------- */
  function buildDoc(st) {
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-js').textContent;
    var json = JSON.stringify(st).replace(/</g, '\\u003c');
    return SHELL_OPEN + HEAD + '<style id="app-style">' + css + '</style><div id="root"></div>' +
      '<script type="application/json" id="data">' + json + '<\/script>' +
      '<script id="app-js">' + js + '<\/script></body></html>';
  }

  function render() {
    if (route() === 'admin') renderAdmin(); else renderSite();
  }
  window.addEventListener('hashchange', function () { render(); });
  render();
})();
</script>
</body></html>
